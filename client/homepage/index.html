<!doctype html>
<html lang="en">
  <head>
    <!-- Character Encoding & Mobile Responsiveness -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary SEO -->
    <title>
      Periodic Thoughts | Science, Research & Innovation by Dr. G. Bamiduro
    </title>

    <meta
      name="description"
      content="Periodic Thoughts is the official blog of Dr. G. Bamiduro featuring insights on science, research, innovation, technology, education, and professional development."
    />

    <meta name="author" content="Dr. G. Bamiduro" />
    <meta name="robots" content="index, follow, max-image-preview:large" />

    <!-- Canonical URL -->
    <link rel="canonical" href="https://www.yourdomain.com/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Periodic Thoughts" />
    <meta
      property="og:title"
      content="Periodic Thoughts | Science, Research & Innovation"
    />
    <meta
      property="og:description"
      content="Explore articles on science, research, innovation, technology, and education by Dr. G. Bamiduro."
    />
    <meta property="og:url" content="https://www.yourdomain.com/" />
    <meta
      property="og:image"
      content="https://www.yourdomain.com/assets/images/og-image.jpg"
    />

    <!-- Twitter/X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Periodic Thoughts | Dr. G. Bamiduro" />
    <meta
      name="twitter:description"
      content="Science, research, innovation, technology, and education insights."
    />
    <meta
      name="twitter:image"
      content="https://www.yourdomain.com/assets/images/og-image.jpg"
    />

    <!-- Theme Color -->
    <meta name="theme-color" content="#0F172A" />

    <!-- Favicons -->
    <link rel="icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Existing Stylesheets -->
    <link rel="stylesheet" href="/homepage/css/main.css" />
    <link rel="stylesheet" href="/homepage/css/index.css" />

    <!-- Structured Data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Blog",
        "name": "Periodic Thoughts",
        "url": "https://www.yourdomain.com/",
        "description": "Official blog of Dr. G. Bamiduro covering science, research, innovation, technology, and education.",
        "author": {
          "@type": "Person",
          "name": "Dr. G. Bamiduro"
        },
        "publisher": {
          "@type": "Person",
          "name": "Dr. G. Bamiduro"
        }
      }
    </script>
  </head>

  <body>
    <header class="header-index">
      <section class="header container" id="nav"></section>

      <section class="hero-section-index container">
        <a href="/posts.html">
          <div class="container hero-section" id="feature-article">
            <h1 id="title-index"></h1>
            <h2 id="subtitle-index"></h2>
            <p id="author"></p>
          </div>
        </a>
      </section>
    </header>

    <main>
      <section class="story-gallery" id="story_gallery"></section>

      <section class="support-work" id="support"></section>
    </main>

    <footer class="footer-section" id="footer"></footer>

    <script src="/homepage/js/layout.js"></script>
    <script src="/homepage/js/index.js"></script>
  </body>
</html>
